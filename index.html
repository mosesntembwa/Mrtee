function norm(s) { return ' ' + s.toLowerCase().replace(/[’']/g, '').replace(/\bt[- ]pin\b/g, 'tpin').replace(/[^a-z0-9%]+/g, ' ').trim() + ' '; }

function find(n) { for (var i = 0; i < S.length; i++) if (S[i].re.test(n)) return i; return -1; }

function info(i, n) {
  var s = S[i], t = s.how;
  if (s.n.indexOf('University') === 0) t += / unza /.test(n) ? " UNZA applications: https://applications.unza.zm/" : / cbu | copperbelt /.test(n) ? " CBU website: https://www.cbu.ac.zm/" : / kmu | kapasa /.test(n) ? " KMU website: https://www.kmu.ac.zm/" : " To check that a university is recognised, use https://online.hea.org.zm/";
  return { t: t + "\n\n" + s.q };
}
function small(n) {
  var words = n.trim().split(' ').length, best = -1, len = 0;
  QN.forEach(function (g, gi) { g.forEach(function (q) { var ql = q.trim().split(' ').length; if (ql <= 2 && words > 4) return; if (n.indexOf(q) > -1 && q.length > len) { best = gi; len = q.length; } }); });
  if (best < 0) return null;
  if (A[best] === '__PRICES__') return prices();
  return { t: A[best].replace('{t}', 'Good ' + tod()).replace('{tl}', tod()), w: WAG.indexOf(best) > -1 ? 1 : 0 };
}
function reply(raw, c) {
  var n = norm(raw), words = n.trim().split(' ').length, i;
  if (c.pend != null) {
    var p = c.pend; c.pend = null;
    if (/ (explain|how|steps|myself|free|teach|guide|1|first|information|info) /.test(n)) { c.last = p; return info(p, n); }
    if (/ (do it|for me|service|you|2|second|yes|fee|help|assist|please|mr tees) /.test(n)) { c.last = p; return svc(p); }
  }
  if (c.last != null && words <= 7 && / (it|that|this) /.test(n) && / (how much|price|cost|fee|charge) /.test(n)) return svc(c.last);
  for (var k = 0; k < X.length; k++) if (X[k][0].test(n)) return { t: X[k][1], w: X[k][2] || 0 };

    if (STRONG.test(n)) { c.last = i; return svc(i); }

    if (AMB.test(n) || words <= 4) { c.pend = i; c.last = i; return { t: "I can help with " + S[i].n + ". Do you want me to explain how to do it yourself, which is free, or do you want MR TEES to do it for you? (the service fee is K" + S[i].f + ")" }; }
  }

  var st = small(n); if (st) return st;
  if (i > -1) { c.last = i; return info(i, n); }
  return { t: "To be honest, I do not have enough information to answer that correctly, and I do not want to mislead you. Please check the official website of the institution you are asking about. I can help with university applications, HELSB, ECZ, ZAQA, TPIN, CV writing and more. What would you like to know?" };
}
function save() { sset('mt_chats', JSON.stringify(chats)); sset('mt_cur', cur); }
function getChat() { return chats.filter(function (c) { return c.id === cur; })[0]; }
function newChat() {
  var c = getChat(); if (c && !c.msgs.length) { render(); $('side').classList.remove('open'); return; }
  var n = { id: 'c' + Date.now(), title: 'New chat', msgs: [], pend: null, last: null };
  chats.unshift(n); cur = n.id; save(); render(); $('side').classList.remove('open');
}
function clean(t) { return t.replace(/\*\*|__|`{1,3}/g, '').replace(/^#+\s*/gm, ''); }
function addAI(box, m) {
  var d = document.createElement('div'); d.className = 'a';
  clean(m.t).split(/(https?:\/\/[^\s)]*[^\s).,;])/).forEach(function (p, i) {
    if (i % 2) { var a = document.createElement('a'); a.href = p; a.target = '_blank'; a.rel = 'noopener'; a.textContent = p; d.appendChild(a); }
    else d.appendChild(document.createTextNode(p));
  });
  if (m.w) {
    var l = document.createElement('a'); l.target = '_blank'; l.rel = 'noopener';
    l.href = 'https://wa.me/' + CFG.whatsapp + '?text=' + encodeURIComponent('Hello Mr Tees, I need help with a service.');
    l.textContent = 'Chat with Moses on WhatsApp: +' + CFG.whatsapp;
    d.appendChild(document.createTextNode('\n\n')); d.appendChild(l);
  }
  box.appendChild(d);
}
function render() {
  var box = $('msgs'), c = getChat(); box.innerHTML = '';
  if (!c) return newChat();
  if (!c.msgs.length) {
    var w = document.createElement('div'); w.className = 'w';
    w.innerHTML = '<div class="g"></div><div class="s">Welcome. Ask me anything about education and our services.</div>';
    w.firstChild.textContent = 'Good ' + tod() + (name ? ', ' + name : '') + '!';
    QUESTIONS.forEach(function (q) { var b = document.createElement('button'); b.className = 'q'; b.textContent = q; b.onclick = function () { send(q); }; w.appendChild(b); });
    box.appendChild(w);
  }
  c.msgs.forEach(function (m) {
    if (m.r === 'u') { var u = document.createElement('div'); u.className = 'u'; u.textContent = m.t; box.appendChild(u); } else addAI(box, m);
  });
  box.scrollTop = box.scrollHeight;
  var h = $('history'); h.innerHTML = '';
  chats.forEach(function (x) {
    var b = document.createElement('button'); b.className = 'h' + (x.id === cur ? ' on' : ''); b.textContent = x.title;
    b.onclick = function () { cur = x.id; save(); render(); $('side').classList.remove('open'); }; h.appendChild(b);
  });
}
function send(text) {
  text = (text || '').trim(); if (!text || busy) return;
  var c = getChat(); busy = true;
  c.msgs.push({ r: 'u', t: text }); if (c.title === 'New chat') c.title = text.slice(0, 40);
  save(); render(); $('input').value = '';
  var box = $('msgs'), p = document.createElement('div'); p.className = 'a typing'; p.innerHTML = '<span></span><span></span><span></span>'; box.appendChild(p); box.scrollTop = box.scrollHeight;
  var done = function (r) { c.msgs.push({ r: 'a', t: r.t, w: r.w ? 1 : 0 }); busy = false; save(); render(); };
  var local = function () { var r; try { r = reply(text, c); } catch (e) { r = { t: 'Sorry, something went wrong. Please try again.' }; } setTimeout(function () { done(r); }, 450 + Math.random() * 450); };
  if (CFG.api && /^https?:/.test(location.protocol)) {
    var payload = c.msgs.map(function (m) { return { role: m.r === 'u' ? 'user' : 'assistant', content: m.t }; });
    var ctl = new AbortController(), tm = setTimeout(function () { ctl.abort(); }, 20000);
    fetch(CFG.api, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: payload, name: name }), signal: ctl.signal })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) { clearTimeout(tm); var t = d.reply || ''; var w = t.indexOf('[[WHATSAPP]]') > -1; done({ t: t.replace('[[WHATSAPP]]', '').trim(), w: w }); })
      .catch(function () { clearTimeout(tm); local(); });
  } else local();
}
$('form').onsubmit = function (e) { e.preventDefault(); send($('input').value); };
$('input').onkeydown = function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(this.value); } };

if (!getChat()) { chats.length ? cur = chats[0].id : newChat(); }
render();
// Moving stars
var cv = $('sky'), cx = cv.getContext('2d'), stars = [], shoot = null, still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function size() { cv.width = innerWidth; cv.height = innerHeight; stars = []; for (var i = 0; i < Math.min(170, innerWidth / 5); i++) stars.push({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 1.7 + .4, v: Math.random() * .3 + .05, t: Math.random() * 6 }); }
function draw() {
  cx.clearRect(0, 0, cv.width, cv.height); cx.shadowColor = '#fff'; cx.shadowBlur = 6; cx.fillStyle = '#fff';
  stars.forEach(function (s) {
    s.y += s.v; s.x += s.v * .35; s.t += .03;
    if (s.y > cv.height) { s.y = 0; s.x = Math.random() * cv.width; } if (s.x > cv.width) s.x = 0;
    cx.globalAlpha = .5 + .5 * Math.sin(s.t); cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
  });
  if (!shoot && Math.random() < .003) shoot = { x: Math.random() * cv.width + 120, y: 0, l: 0 };
  if (shoot) { shoot.x -= 9; shoot.y += 5; shoot.l += 1; cx.globalAlpha = Math.max(0, 1 - shoot.l / 45); cx.strokeStyle = '#fff'; cx.lineWidth = 1.6; cx.beginPath(); cx.moveTo(shoot.x, shoot.y); cx.lineTo(shoot.x + 70, shoot.y - 39); cx.stroke(); if (shoot.l > 45) shoot = null; }
  if (!still) requestAnimationFrame(draw);
}
addEventListener('resize', size); size(); draw();
})();
